services:
  # =========================
  # N8N
  # =========================
  - type: web
    name: n8n
    runtime: image
    image:
      url: n8nio/n8n:latest
    plan: starter
    envVars:
      - key: DB_TYPE
        value: postgresdb

      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host

      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-db
          property: port

      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database

      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user

      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password

      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"

      - key: N8N_BASIC_AUTH_USER
        value: admin

      - key: N8N_BASIC_AUTH_PASSWORD
        value: admin123

      - key: N8N_HOST
        value: n8n.onrender.com

      - key: WEBHOOK_URL
        value: https://n8n.onrender.com

      - key: GENERIC_TIMEZONE
        value: America/Sao_Paulo

  # =========================
  # PAPI
  # =========================
  - type: web
    name: pastorini-api
    runtime: image
    image:
      url: intrategica/papi-free:1.5.1
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      - key: PANEL_API_KEY
        value: teste123

      - key: STORAGE_TYPE
        value: postgres+redis

      - key: POSTGRES_HOST
        fromDatabase:
          name: papi-db
          property: host

      - key: POSTGRES_PORT
        fromDatabase:
          name: papi-db
          property: port

      - key: POSTGRES_DB
        fromDatabase:
          name: papi-db
          property: database

      - key: POSTGRES_USER
        fromDatabase:
          name: papi-db
          property: user

      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: papi-db
          property: password

      - key: REDIS_HOST
        fromService:
          type: redis
          name: papi-redis
          property: host

      - key: REDIS_PORT
        fromService:
          type: redis
          name: papi-redis
          property: port

  # =========================
  # EASY APPOINTMENTS
  # =========================
  - type: web
    name: easyappointments
    runtime: image
    image:
      url: alextselegidis/easyappointments:latest
    plan: starter
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: easy-db
          property: host

      - key: DB_NAME
        fromDatabase:
          name: easy-db
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: easy-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: easy-db
          property: password

databases:
  - name: n8n-db
    plan: free
    databaseName: n8n
    user: n8n

  - name: papi-db
    plan: free
    databaseName: pastorini
    user: postgres

  - name: easy-db
    plan: free
    databaseName: easyappointments
    user: easyuser

redis:
  - name: papi-redis
    plan: free
